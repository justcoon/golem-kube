# shard manager service configuration
shardManager:
  image:
    name: golemservices/golem-shard-manager
    tag: v1.4.2
  imagePullPolicy: Always
  ports:
    http: 8081
    grpc: 9001
  service:
    type: ClusterIP
  worker:
    healthCheckType: "K8s"
  redis:
    port: 6379
    host: golem-redis-master
    username: ""
    database: 0
    password:
      type: secret # secret or plain, or none if no auth
      plain: ""
      secret: # password from kubernetes secret
        name: golem-redis
        key: redis-password
#  nodeSelector:  # added, if defined, see: https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes/

# worker executor service configuration
workerExecutor:
  image:
    name: golemservices/golem-worker-executor
    tag: v1.4.2
  imagePullPolicy: Always
  replica: 1
  ports:
    http: 8080
    grpc: 9000
  service:
    type: ClusterIP
  redis:
    port: 6379
    host: golem-redis-master
    username: ""
    database: 0
    password:
      type: secret # secret or plain, or none if no auth
      plain: ""
      secret: # password from kubernetes secret
        name: golem-redis
        key: redis-password
#  nodeSelector: # added, if defined, see: https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes/

# worker service configuration
workerService:
  image:
    name: golemservices/golem-worker-service
    tag: v1.4.2
  imagePullPolicy: Always
  replica: 1
  ports:
    http: 9005
    requestHttp: 9006 # worker API Gateway
    grpc: 9007
  service:
    type: ClusterIP
  redis:
    port: 6379
    host: golem-redis-master
    username: ""
    database: 0
    password:
      type: secret # secret or plain, or none if no auth
      plain: ""
      secret: # password from kubernetes secret
        name: golem-redis
        key: redis-password
#  nodeSelector: # added, if defined, see: https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes/

# component compilation service configuration
componentCompilationService:
  image:
    name: golemservices/golem-component-compilation-service
    tag: v1.4.2
  imagePullPolicy: Always
  replica: 1
  ports:
    http: 8084
    grpc: 9091
  service:
    type: ClusterIP
#  nodeSelector: # added, if defined, see: https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes/

# registry service configuration
registryService:
  image:
    name: golemservices/registry-service
    tag: v1.4.2
  imagePullPolicy: Always
  replica: 1
  ports:
    http: 9000
    grpc: 9001
  service:
    type: ClusterIP
  postgres:
    port: 5432
    host: golem-postgres-postgresql
    database: golem_db
    username: golem_user
    schema: golem_registry
    password:
      type: secret # secret or plain
      plain: ""
      secret: # password from kubernetes secret
        name: golem-postgres-postgresql
        key: password
  cors:
    originRegex: ""
  login:
    type: Disabled
  initialAccounts:
    root:
      token: "n0AstqJ6cBgh9ob2BBT_h39t7B00I-8wSnBBix2lo-I"
    marketing:
      token: "evJ-8NPn7hIPBJ-htGgfZkk36PeA-UGAmT2iKasTFM4"

# debugging service configuration
debuggingService:
  image:
    name: golemservices/golem-debugging-service
    tag: v1.4.2
  imagePullPolicy: Always
  replica: 1
  ports:
    http: 9002
  service:
    type: ClusterIP
  redis:
    port: 6379
    host: golem-redis-master
    username: ""
    database: 0
    password:
      type: secret # secret or plain, or none if no auth
      plain: ""
      secret: # password from kubernetes secret
        name: golem-redis
        key: redis-password

# logging configuration - used in all services
logging:
  json: false # true, if json log output should be used

# service account name  - used in all services, see: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccountName: golem-sa-default

env: default

